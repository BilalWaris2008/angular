<div class="login-container">
    <div class="login-box">
        <h2>Login</h2>

        <div class="error-message">
            @if (errorMsg) {
            <p class="bg-danger p-2 text-white"><b>{{ errorMsg }}</b></p>
            }
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required [(ngModel)]="email" />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required [(ngModel)]="password" />
        </div>

        <button type="submit" (click)="login()">Login</button>


        <p class="signup-text">
            Don't have an account?
            <a href="#">Sign up</a>
        </p>
    </div>
</div>
